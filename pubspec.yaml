name: ouinon
description: "Ouinon : réponds depuis la notif, vois ce qui va avec quoi."
publish_to: 'none'

# Version et numéro de compilation (x.y.z+n) : monter n avant chaque envoi
# sur un store (il doit toujours augmenter).
version: 1.0.0+23

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4+1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  fl_chart: 1.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Unbounded (titres) et Figtree (texte), VT323 et IBM Plex Mono (écran
  # rétro du jour), licence OFL : assets/fonts/OFL-*.txt.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-400.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-700.ttf
          weight: 700
