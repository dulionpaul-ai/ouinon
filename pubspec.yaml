name: ouinon
description: "Ouinon : réponds depuis la notif, vois ce qui va avec quoi."
publish_to: 'none'

# Version et numéro de compilation (x.y.z+n) : monter n avant chaque envoi
# sur un store (il doit toujours augmenter).
version: 1.0.0+35

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4+1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  fl_chart: 1.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Une seule police partout : Oxanium (licence OFL :
  # assets/fonts/OFL-Oxanium.txt).
  fonts:
    - family: Oxanium
      fonts:
        - asset: assets/fonts/Oxanium-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oxanium-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oxanium-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oxanium-Bold.ttf
          weight: 700
