name: ouinon
description: "Oui-Non : réponds depuis la notif, vois ce qui va avec quoi."
publish_to: 'none'

# Version et numéro de compilation (x.y.z+n) : monter n avant chaque envoi
# sur un store (il doit toujours augmenter).
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4+1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
